[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ticket-booking-system"
version = "0.1.0"
description = "Ticket booking system with seat holds, concurrency guarantees and a waitlist offer cascade."
requires-python = ">=3.11,<3.12"
license = "MIT"
dependencies = [
  "alembic==1.19.1",
  "fastapi==0.141.1",
  "pydantic==2.13.4",
  "pydantic-settings==2.15.0",
  "sqlalchemy==2.0.52",
  "structlog==26.1.0",
  "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
dev = [
  "anyio==4.14.2",
  # Floor, not an exact pin: 2.1.0 and 2.2.0 carry a known high-severity
  # vulnerability, so anything below 2.11.0 must never be resolved.
  "httpx2>=2.11.0",
  "mypy==2.3.1",
  "pre-commit==4.6.2",
  "pytest==9.1.1",
  "pyyaml==6.0.3",
  "ruff==0.16.4",
  "types-pyyaml==6.0.12.20260815",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
  "A",    # flake8-builtins
  "ARG",  # unused arguments
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "DTZ",  # flake8-datetimez: no naive datetimes, timestamps come from Postgres
  "E",    # pycodestyle errors
  "ERA",  # eradicate: no commented-out code (Definition of Done)
  "F",    # pyflakes: unused imports and names (Definition of Done)
  "I",    # isort
  "N",    # pep8-naming
  "PTH",  # prefer pathlib
  "RET",  # flake8-return
  "RUF",  # ruff-specific
  "S",    # flake8-bandit
  "SIM",  # flake8-simplify
  "T20",  # flake8-print: no debug prints (Definition of Done)
  "TID",  # flake8-tidy-imports
  "UP",   # pyupgrade
  "W",    # pycodestyle warnings
]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and that is the point of a test.
"tests/**" = ["S101"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["app", "migrations", "tests"]
strict = true
warn_unreachable = true
enable_error_code = [
  "ignore-without-code",
  "redundant-expr",
  "truthy-bool",
]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
xfail_strict = true
# A DeprecationWarning is how a dependency tells you the build is about to
# break. Failing on it turns that into a red pull request rather than a
# surprise on an upgrade months later.
filterwarnings = ["error"]
