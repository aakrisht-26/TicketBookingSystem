# Local hooks. CI re-runs the same checks independently, so a bypassed hook is
# caught at the pull request rather than merged.
#
# Install once, from the backend virtualenv:  pre-commit install
default_install_hook_types: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.4
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # mypy needs the project's dependencies to say anything useful, so the hook
  # declares them. The environment is isolated and reproducible, which a
  # `language: system` hook is not: that one silently resolves whichever mypy is
  # first on PATH, and a global install without these dependencies reports
  # dozens of import errors that look like real findings.
  #
  # The duplication is the cost, and it is guarded rather than trusted:
  # tests/test_toolchain.py::test_precommit_mypy_dependencies_match_pyproject
  # fails if this list and backend/pyproject.toml ever disagree.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.3.1
    hooks:
      - id: mypy
        name: mypy --strict (backend)
        args: [--config-file, backend/pyproject.toml, backend/app, backend/migrations, backend/tests]
        files: ^backend/
        pass_filenames: false
        additional_dependencies:
          - alembic==1.19.1
          - fastapi==0.141.1
          - httpx2>=2.11.0
          - pydantic==2.13.4
          - pydantic-settings==2.15.0
          - pytest==9.1.1
          - sqlalchemy==2.0.52
          - structlog==26.1.0
          - types-pyyaml==6.0.12.20260815
          - uvicorn[standard]==0.52.4
